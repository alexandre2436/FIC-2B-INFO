<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style1.css">
<title>Ninja Runner</title>
</head>

<body>

<div class="game">

    <div class="moon"></div>

    <div class="mountains">
        <div class="mountain"></div>
        <div class="mountain"></div>
        <div class="mountain"></div>
    </div>

    <!-- BAMBUS -->

    <div class="bamboo-area">

        <div class="bamboo b1"></div>
        <div class="bamboo b2"></div>
        <div class="bamboo b3"></div>
        <div class="bamboo b4"></div>

        <div class="bamboo b5"></div>
        <div class="bamboo b6"></div>
        <div class="bamboo b7"></div>
        <div class="bamboo b8"></div>

        <div class="leaf leaf1"></div>
        <div class="leaf leaf2"></div>
        <div class="leaf leaf3"></div>
        <div class="leaf leaf4"></div>

    </div>

    <!-- PERSONAGEM -->

    <div class="ninja">

        <div class="head"></div>

        <div class="body"></div>

        <div class="arm left"></div>
        <div class="arm right"></div>

        <div class="leg left"></div>
        <div class="leg right"></div>

    </div>

    <!-- OBSTÁCULO -->

    <div class="obstacle"></div>

    <!-- MOEDA -->

    <div class="coin"></div>

    <!-- PLACAR -->

    <div class="title">
        NINJA RUNNER
    </div>

    <div class="score">
        SCORE: 00000
    </div>

    <!-- CHÃO -->

    <div class="ground">
        <div class="grass"></div>
    </div>

</div>

</body>
</html>
