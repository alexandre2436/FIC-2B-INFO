<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <section class="bloco-de-conceito">

    <div class="crud-form">

        <label for="supabaseUrl">Project URL</label>
         <input id="supabaseUrl" type="url" placeholder="sb_publishable_VeSfGejLGtjtwqM0YETCLQ_7TmyzX55" autocomplete="url">
        <label for="supabaseKey">Publishable key / anon key</label>
        <input id="supabaseKey" type="password" placeholder="sb_publishable_... ou eyJ..." autocomplete="off">
      <div class="controles">
    <button id="btnConectar" type="button">Conectar e carregar jogadores</button>
    <button id="btnDesconectar" type="button" class="botao-neutro">Desconectar</button>
      </div>
      <p id="statusConexao" role="status" aria-live="polite">Ainda nao conectado.</p>
    </div>
  </section>

   <section class="crud-layout" aria-labelledby="tituloFormularioSupabase">
    <form id="formJogadorSupabase" class="crud-form" novalidate>
      <h3 id="tituloFormularioSupabase">cadastrar jogador no supabase</h3>
      <label for="nomeJogadorSupabase">Nome</label>
      <input id="nomeJogadorSupabase" name="nome" type="text" minlength="2" maxlength="60" required placeholder="Ex.: Ana Silva">
      <label for="pontuacaoJogadorSupabase">Pontuacao maxima</label>
      <input id="pontuacaoJogadorSupabase" name="pontuacao" type="number" min="0" max="999999" step="1" value="0" required>
      <label for="corJogadorSupabase">Cor do personagem</label>
      <div class="campo-cor"><input id="corJogadorSupabase" name="cor" type="color" value="#22c55e"><output id="valorCorSupabase">#22c55e</output></div>
      <div class="controles">
        <button id="btnSalvarSupabase" type="submit">Cadastrar no banco</button>
        <button id="btnCancelarSupabase" type="button" class="botao-neutro" hidden>Cancelar edicao</button>
      </div>
      <p id="mensagemCrudSupabase" class="mensagem-crud" role="status" aria-live="polite"></p>
    </form>
    
</body>
</html>
