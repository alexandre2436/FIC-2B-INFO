<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NinjaRunner</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; font-family: 'Press Start 2P', monospace; }

  #intro {
    position: fixed; inset: 0;
      background: url('ninja.png') center / cover no-repeat;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.5rem;
  }
  .titulo {
    margin: 0; padding: 0 1rem; text-align: center;
    color: #ffd700; font-size: clamp(1.4rem, 6vw, 3rem);
    text-shadow: 4px 4px 0 #000;
  }
  button {
    font-family: inherit; font-size: 1rem; padding: 1rem 1.4rem;
    background: #ffd700; color: #000; border: 4px solid #000; cursor: pointer;
  }

  #fogo {
    position: fixed; inset: 0; z-index: 100; pointer-events: none;
    background: linear-gradient(to bottom, #ffd000, #ff6a00 15%, #d92b00 40%, #7a0000 75%, #000);
    transform: translateY(calc(100% + 100px));
  }
  #fogo::before {
    content: ""; position: absolute; left: 0; right: 0; bottom: 100%; height: 90px;
    background: radial-gradient(circle at 50% 100%, #ffd000 0 38%, transparent 40%) 0 0 / 56px 90px repeat-x;
    transform-origin: bottom;
    animation: tremer 0.18s infinite alternate;
  }
  #fogo.ativo { animation: subir 1.8s linear forwards; }

  @keyframes subir {
    0%   { transform: translateY(calc(100% + 100px)); }
    50%  { transform: translateY(0); }
    100% { transform: translateY(-100%); }
  }
  @keyframes tremer {
    from { transform: scaleY(0.8); }
    to   { transform: scaleY(1.2); }
  }
</style>
</head>
<body>
       <img src="ninja.png" width="200">
  <div id="intro">
    <h1 class="titulo">NinjaRunner</h1>
    <button id="comecar">Começar</button>
  </div>

  <div id="fogo"></div>

<script>
  const fogo = document.getElementById('fogo');

  function iniciarJogo() {
    fogo.classList.add('ativo');

    setTimeout(() => {
      window.location.href = '../ninja_jogo/index.html';
    }, 900);
  }

  document.getElementById('comecar').onclick = iniciarJogo;
</script>
</body>
</html>
